name: scheduled-retrain

on:
  schedule:
    - cron: "0 6 2 * *"  # 06:00 UTC on the 2nd of every month
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: scheduled-retrain
  cancel-in-progress: false

env:
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: scheduled-${{ github.run_id }}

      - name: Find newest batch
        id: batch
        run: |
          latest=$(python -m src.find_latest_batch)
          current=$(python -c "from src.utils import load_params; print(load_params()['batch'])")
          branch="drift/batch-$latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "::notice::params.yaml already on newest batch $latest, nothing to do"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::notice::branch $branch already exists (PR pending), skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::new batch $latest (current $current)"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump params and rerun pipeline
        if: steps.batch.outputs.run == 'true'
        run: |
          python -m src.bump_params --batch "${{ steps.batch.outputs.latest }}"
          python -m src.configure_remote
          dvc pull --allow-missing || true
          dvc repro
          dvc push

      - name: Open pull request
        if: steps.batch.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BATCH: ${{ steps.batch.outputs.latest }}
          BRANCH: ${{ steps.batch.outputs.branch }}
        run: |
          python - <<'EOF' > pr_body.md
          import json, pathlib
          m = json.load(open("reports/metrics.json"))
          p = json.load(open("reports/promotion.json"))
          print(f"Automated monthly retrain on batch `{m['batch']}`.\n")
          print(pathlib.Path("reports/drift.md").read_text())
          print("### Model")
          print(f"- PR-AUC **{m['pr_auc']:.4f}** (gate >= {m['min_pr_auc']}: {'passed' if m['gate_passed'] else '**FAILED**'})")
          print(f"- ROC-AUC {m['roc_auc']:.4f}, recall@P90 {m['recall_at_precision_90']:.3f}")
          print(f"- Promotion: **{'promote' if p['promote'] else 'keep prod'}** — {p['reason']}\n")
          print("Merging this PR runs `train.yaml` on main, which publishes the model if it is promoted.")
          EOF
          drift=$(python -c "import json; print('drift' if json.load(open('reports/drift.json'))['drift_detected'] else 'no drift')")
          gate=$(python -c "import json; print('' if json.load(open('reports/metrics.json'))['gate_passed'] else ' [gate failed]')")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add params.yaml dvc.lock reports/*.json reports/drift.md
          git commit -m "Retrain on batch $BATCH ($drift)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Monthly retrain: batch $BATCH ($drift)$gate" \
            --body-file pr_body.md
